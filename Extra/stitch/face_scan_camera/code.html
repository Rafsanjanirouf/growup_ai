<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary-container": "#9995ff",
                    "primary-dim": "#675df9",
                    "on-error": "#490013",
                    "secondary-fixed-dim": "#29e4cb",
                    "inverse-primary": "#5044e3",
                    "outline-variant": "#46465c",
                    "surface-bright": "#292948",
                    "on-tertiary-fixed-variant": "#665500",
                    "secondary-container": "#006b5e",
                    "on-primary-fixed": "#000000",
                    "on-background": "#e5e3ff",
                    "on-tertiary-container": "#5b4b00",
                    "surface": "#0c0c1f",
                    "on-error-container": "#ffb2b9",
                    "error-container": "#a70138",
                    "on-surface": "#e5e3ff",
                    "on-secondary-container": "#ddfff6",
                    "background": "#0c0c1f",
                    "surface-tint": "#a8a4ff",
                    "error-dim": "#d73357",
                    "error": "#ff6e84",
                    "secondary-dim": "#29e4cb",
                    "tertiary": "#ffe792",
                    "surface-container-highest": "#23233f",
                    "on-tertiary-fixed": "#453900",
                    "on-secondary-fixed": "#004239",
                    "primary-fixed": "#9995ff",
                    "secondary-fixed": "#43f3d9",
                    "tertiary-container": "#ffd709",
                    "surface-dim": "#0c0c1f",
                    "surface-container-high": "#1d1d37",
                    "on-surface-variant": "#aaa8c3",
                    "on-primary-container": "#16007d",
                    "tertiary-dim": "#efc900",
                    "tertiary-fixed": "#ffd709",
                    "surface-container": "#17172f",
                    "surface-variant": "#23233f",
                    "primary-fixed-dim": "#8a85ff",
                    "on-secondary-fixed-variant": "#006155",
                    "on-primary": "#1e009f",
                    "secondary": "#43f3d9",
                    "tertiary-fixed-dim": "#efc900",
                    "on-tertiary": "#655400",
                    "primary": "#a8a4ff",
                    "on-secondary": "#00574c",
                    "surface-container-low": "#111127",
                    "on-primary-fixed-variant": "#1d0098",
                    "inverse-on-surface": "#53536a",
                    "surface-container-lowest": "#000000",
                    "inverse-surface": "#fcf8ff",
                    "outline": "#74738b"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Plus Jakarta Sans"],
                    "body": ["Plus Jakarta Sans"],
                    "label": ["Plus Jakarta Sans"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .kinetic-gradient {
            background: linear-gradient(135deg, #a8a4ff 0%, #43f3d9 100%);
        }
        .scanning-line {
            height: 2px;
            background: linear-gradient(90deg, transparent, #43f3d9, transparent);
            box-shadow: 0 0 15px #43f3d9;
            animation: scan 3s ease-in-out infinite;
            position: absolute;
            width: 100%;
            z-index: 20;
        }
        @keyframes scan {
            0%, 100% { top: 10%; }
            50% { top: 90%; }
        }
        .landmark-dot {
            width: 4px;
            height: 4px;
            background-color: #43f3d9;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 8px #43f3d9;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body min-h-screen flex flex-col overflow-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-slate-950/80 backdrop-blur-xl shadow-2xl shadow-indigo-500/10 flex justify-between items-center px-6 h-16">
<div class="flex items-center gap-4">
<button class="hover:opacity-80 transition-all active:scale-95 transition-transform text-[#a8a4ff]">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-['Plus_Jakarta_Sans'] tracking-tight text-xl font-bold tracking-tighter text-[#a8a4ff]">Face Scan</h1>
</div>
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-surface-container-highest overflow-hidden">
<img alt="User Profile" data-alt="close-up portrait of a young professional with clean lighting and neutral background for avatar use" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA8SEbB8yfMNtsSK0xnJn_8v0bJJxJaDXFGlTwadE5dAjruyHiS-20CR2kFpWqwRX8IltLNPl0pmUanssTr6mXDHo6ONShdJO5_tLycg3lCoSD0_JckyGgnjfxHo5DuhVfLQvY-98m1jDK_LnbiAaVtuTlLRZ1wUasyDopDaYjkjsW1jeKLM3CsamQL3G_5mK803BVNrb4eIepasv3xtN3EFdXGxf_nnTjNvAwcE8-L-Ap44QkDLHw2dj13KdI0kUSX2hqfmrwdPWE"/>
</div>
<button class="hover:opacity-80 transition-all active:scale-95 transition-transform text-slate-400">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 mt-16 pb-32 flex flex-col items-center justify-center px-6 relative">
<!-- Viewfinder Section -->
<div class="w-full max-w-md aspect-[3/4] relative group">
<!-- Asymmetrical Grid Background Elements -->
<div class="absolute -top-4 -left-4 w-24 h-24 border-t-4 border-l-4 border-secondary/30 rounded-tl-xl"></div>
<div class="absolute -bottom-4 -right-4 w-24 h-24 border-b-4 border-r-4 border-primary/30 rounded-br-xl"></div>
<!-- Main Container -->
<div class="w-full h-full bg-surface-container-low rounded-lg overflow-hidden relative shadow-2xl shadow-black/50">
<!-- Camera Feed Simulation -->
<div class="absolute inset-0 bg-cover bg-center opacity-60 mix-blend-luminosity" data-alt="a person's face silhouette in a dimly lit setting with digital data overlays and holographic scanning effects" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDfeiVW8FVLUhQ2aVltvWLSlJojBBMlf3ptxM6PYBu4MEmDO7y9s8mVRo8v73LAmYW-CxXHBitz9Vnt8BkKnyJcdWzKmEgDSvrSSgydH58lwW3p1XdPthqfRpyy1Br6fSm7XzCcwab5omgr5Iek0psjtHaCc6Vy--2-p5SPosquhI_IyllWmlrnjh3lOAPExm3npYYZCi14dqg_ufLN6SA1qquRFAKmKbdHK1FVsY9mJwYo_16MDuZbX5NAlHiCwoyeCYIc9JL82Eg')"></div>
<!-- Scanning UI Layer -->
<div class="absolute inset-0 z-10">
<!-- Face Silhouette Frame -->
<div class="absolute inset-0 flex items-center justify-center">
<div class="w-2/3 h-3/4 border-2 border-dashed border-on-surface-variant/20 rounded-full flex items-center justify-center">
<!-- Scanning Animation Line -->
<div class="scanning-line"></div>
<!-- Landmark Points -->
<div class="landmark-dot" style="top: 30%; left: 35%;"></div>
<div class="landmark-dot" style="top: 30%; left: 65%;"></div>
<div class="landmark-dot" style="top: 45%; left: 50%;"></div>
<div class="landmark-dot" style="top: 60%; left: 40%;"></div>
<div class="landmark-dot" style="top: 60%; left: 60%;"></div>
<div class="landmark-dot" style="top: 75%; left: 50%;"></div>
</div>
</div>
<!-- Overlay Text Info -->
<div class="absolute top-6 left-6 flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-secondary animate-pulse"></div>
<span class="text-xs font-bold tracking-widest uppercase text-secondary">AI Analyzing...</span>
</div>
<div class="absolute bottom-6 right-6">
<span class="text-[10px] font-mono text-on-surface-variant tracking-tighter">HD_STREAM // 60FPS</span>
</div>
</div>
<!-- Glass Blur Border -->
<div class="absolute inset-0 border-[12px] border-surface-container-low/50 backdrop-blur-[2px] pointer-events-none"></div>
</div>
</div>
<!-- Controls Section -->
<div class="mt-8 flex flex-col items-center w-full">
<!-- Status Label -->
<div class="mb-6 bg-tertiary-container/10 px-4 py-1.5 rounded-full flex items-center gap-2">
<span class="material-symbols-outlined text-tertiary text-sm" style="font-variation-settings: 'FILL' 1;">bolt</span>
<span class="text-xs font-bold text-tertiary tracking-wide uppercase">1 Free Scan Left Today</span>
</div>
<!-- Capture Button -->
<button class="relative group active:scale-90 transition-all duration-200">
<div class="absolute -inset-4 kinetic-gradient rounded-full blur-2xl opacity-20 group-hover:opacity-40 transition-opacity"></div>
<div class="w-20 h-20 rounded-full p-1.5 bg-surface-container-highest border border-white/10 relative z-10">
<div class="w-full h-full rounded-full kinetic-gradient flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-on-primary-fixed text-4xl" style="font-variation-settings: 'FILL' 1;">face_5</span>
</div>
</div>
</button>
<!-- Lighting Tip -->
<div class="mt-10 px-6 py-4 bg-surface-container-high/40 rounded-xl flex items-center gap-4 max-w-sm">
<div class="w-10 h-10 rounded-full bg-secondary/10 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-secondary">lightbulb</span>
</div>
<div>
<p class="text-sm font-semibold text-on-surface">Lighting Tip</p>
<p class="text-xs text-on-surface-variant">Use natural light for best results and avoid heavy shadows.</p>
</div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full rounded-t-[3rem] z-50 bg-slate-950/90 backdrop-blur-2xl shadow-[0_-8px_40px_rgba(108,99,255,0.12)] flex justify-around items-center h-24 px-4 pb-4">
<!-- Scan (Active) -->
<div class="flex flex-col items-center justify-center bg-[#a8a4ff]/10 text-[#43f3d9] rounded-full px-5 py-2 active:scale-90 duration-200 cursor-pointer">
<span class="material-symbols-outlined" data-weight="fill" style="font-variation-settings: 'FILL' 1;">face_5</span>
<span class="font-['Plus_Jakarta_Sans'] text-[10px] font-bold uppercase tracking-widest mt-1">Scan</span>
</div>
<!-- Analysis -->
<div class="flex flex-col items-center justify-center text-slate-500 hover:text-[#a8a4ff] transition-colors cursor-pointer">
<span class="material-symbols-outlined">analytics</span>
<span class="font-['Plus_Jakarta_Sans'] text-[10px] font-bold uppercase tracking-widest mt-1">Analysis</span>
</div>
<!-- Insight -->
<div class="flex flex-col items-center justify-center text-slate-500 hover:text-[#a8a4ff] transition-colors cursor-pointer">
<span class="material-symbols-outlined">bolt</span>
<span class="font-['Plus_Jakarta_Sans'] text-[10px] font-bold uppercase tracking-widest mt-1">Insight</span>
</div>
<!-- Account -->
<div class="flex flex-col items-center justify-center text-slate-500 hover:text-[#a8a4ff] transition-colors cursor-pointer">
<span class="material-symbols-outlined">person</span>
<span class="font-['Plus_Jakarta_Sans'] text-[10px] font-bold uppercase tracking-widest mt-1">Account</span>
</div>
</nav>
</body></html>
